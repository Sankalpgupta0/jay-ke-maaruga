# Simple Nginx Configuration for Koshpal API
# Place this in /etc/nginx/sites-available/api.koshpal.com

server {
    listen 80;
    server_name api.koshpal.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.koshpal.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.koshpal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.koshpal.com/privkey.pem;

    # Basic SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;

    # Proxy all requests to your NestJS backend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Basic timeout
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# Redirect www to non-www
server {
    listen 443 ssl http2;
    server_name www.api.koshpal.com;
    ssl_certificate /etc/letsencrypt/live/api.koshpal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.koshpal.com/privkey.pem;
    return 301 https://api.koshpal.com$request_uri;
}